# Sert le build statique de KAIROS et route tout vers index.html : react-
# router-dom gère la navigation côté client (/agenda, /parametres, ... n'ont
# pas de fichier correspondant sur le disque).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy vers le backend (service « backend » du réseau Compose).
    # Permet, sur un serveur, de tout servir depuis une seule origine :
    # VITE_AGENT_API_URL=<URL publique du frontend>, sans CORS ni port 8000
    # exposé au navigateur. Inutilisé si VITE_AGENT_API_URL vise :8000.
    location /api/ {
        # Résolution DNS à la requête (DNS interne Docker) : nginx démarre
        # même si le backend redémarre ou change d'IP.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $kairos_backend http://backend:8000;
        proxy_pass $kairos_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Import de documents (/api/import/analyze) : au-delà du 1 Mo par défaut.
        client_max_body_size 25m;
        # Au-delà de LLM_TIMEOUT (120 s) : premier chargement du modèle sur CPU.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
